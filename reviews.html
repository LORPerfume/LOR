<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-GWRGSSJ8B2"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag("js",new Date());gtag("config","G-GWRGSSJ8B2");</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>آراء العملاء | LOR Perfume</title>
<meta name="description" content="آراء حقيقية من عميلات LOR' Butter Perfume بعد ما وصلهم الطلب.">
<link rel="canonical" href="https://lorperfume.com/reviews.html">
<link rel="icon" type="image/png" href="favicon.png">
<meta name="theme-color" content="#f6efe6">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6efe6;--card:#fbf7f2;--ink:#2e231c;--muted:#7d6c5f;--gold:#a8823f;--line:rgba(46,35,28,.12);--btn:#3b2c23}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",Tahoma,sans-serif;line-height:1.7}
a{color:inherit;text-decoration:none}
header{position:sticky;top:0;z-index:10;background:rgba(246,239,230,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
header .w{max-width:1180px;margin:0 auto;padding:0 20px;height:68px;display:flex;align-items:center;justify-content:space-between}
header img{height:44px}
header a.back{font-size:14px;color:var(--muted)}
.btn{display:inline-block;background:var(--btn);color:#f7efe6;padding:12px 26px;border-radius:4px;font-size:14.5px}
main{max-width:1180px;margin:0 auto;padding:40px 20px 60px}
.eyebrow{display:block;text-align:center;font-size:11.5px;letter-spacing:.32em;text-transform:uppercase;color:var(--gold);direction:ltr}
h1{text-align:center;font-size:clamp(26px,4vw,34px);margin:8px 0 6px}
.sub{text-align:center;color:var(--muted);margin:0 0 30px}
.grid{columns:4 220px;column-gap:14px}
.it{display:block;width:100%;margin:0 0 14px;padding:0;border:1px solid var(--line);background:var(--card);border-radius:6px;overflow:hidden;cursor:zoom-in;break-inside:avoid}
.it img{width:100%;display:block}
.cta{text-align:center;margin-top:30px}
.lb{position:fixed;inset:0;z-index:50;background:rgba(20,15,12,.92);display:none;align-items:center;justify-content:center}
.lb.open{display:flex}
.lb img{max-width:92vw;max-height:86vh;border-radius:8px}
.lb button{position:absolute;background:rgba(255,255,255,.12);color:#fff;border:none;width:46px;height:46px;border-radius:50%;font-size:24px;cursor:pointer}
.lb .x{top:16px;left:16px} .lb .p{right:12px;top:calc(50% - 23px)} .lb .n{left:12px;top:calc(50% - 23px)}
.lb .c{position:absolute;bottom:18px;left:0;right:0;text-align:center;color:#ddd;font-size:13px;direction:ltr}
body.locked{overflow:hidden}
footer{background:var(--btn);color:#d9cbbb;text-align:center;padding:26px 0;font-size:13.5px}
</style>
</head>
<body>
<header><div class="w">
  <a href="index.html"><img src="logo-gold.png" alt="LOR Perfume"></a>
  <a class="back" href="index.html">← الرئيسية</a>
</div></header>
<main>
  <span class="eyebrow">Reviews</span>
  <h1>آراء عملائنا</h1>
  <p class="sub">رسائل حقيقية من عميلاتنا بعد ما وصلهم الطلب 🤍 اضغطي على الصورة لتكبيرها.</p>
  <div class="grid" id="grid">
    <button class="it" type="button"><img src="reviews/r01.webp" alt="" loading="lazy"></button>
    <button class="it" type="button"><img src="reviews/r02.webp" alt="" loading="lazy"></button>
    <button class="it" type="button"><img src="reviews/r03.webp" alt="" loading="lazy"></button>
    <button class="it" type="button"><img src="reviews/r04.webp" alt="" loading="lazy"></button>
    <button class="it" type="button"><img src="reviews/r05.webp" alt="" loading="lazy"></button>
    <button class="it" type="button"><img src="reviews/r06.webp" alt="" loading="lazy"></button>
    <button class="it" type="button"><img src="reviews/r07.webp" alt="" loading="lazy"></button>
    <button class="it" type="button"><img src="reviews/r08.webp" alt="" loading="lazy"></button>
    <button class="it" type="button"><img src="reviews/r09.webp" alt="" loading="lazy"></button>
    <button class="it" type="button"><img src="reviews/r10.webp" alt="" loading="lazy"></button>
    <button class="it" type="button"><img src="reviews/r11.webp" alt="" loading="lazy"></button>
    <button class="it" type="button"><img src="reviews/r12.webp" alt="" loading="lazy"></button>
    <button class="it" type="button"><img src="reviews/r13.webp" alt="" loading="lazy"></button>
    <button class="it" type="button"><img src="reviews/r14.webp" alt="" loading="lazy"></button>
    <button class="it" type="button"><img src="reviews/r15.webp" alt="" loading="lazy"></button>
    <button class="it" type="button"><img src="reviews/r16.webp" alt="" loading="lazy"></button>
  </div>
  <div class="cta"><a class="btn" href="index.html#products">اطلبي الآن</a></div>
</main>
<footer>© LOR' Perfume</footer>
<div class="lb" id="lb"><button class="x" aria-label="close">×</button><button class="p" aria-label="prev">›</button><img id="lbi" alt=""><button class="n" aria-label="next">‹</button><div class="c" id="lbc"></div></div>
<script>
const its=[...document.querySelectorAll("#grid .it")],lb=document.getElementById("lb"),im=document.getElementById("lbi"),c=document.getElementById("lbc");let cur=0;
function show(i){cur=(i+its.length)%its.length;im.src=its[cur].querySelector("img").src;c.textContent=(cur+1)+" / "+its.length;}
its.forEach((b,i)=>b.addEventListener("click",()=>{show(i);lb.classList.add("open");document.body.classList.add("locked");}));
const close=()=>{lb.classList.remove("open");document.body.classList.remove("locked");};
lb.querySelector(".x").onclick=close;lb.onclick=e=>{if(e.target===lb)close();};
lb.querySelector(".n").onclick=()=>show(cur+1);lb.querySelector(".p").onclick=()=>show(cur-1);
document.addEventListener("keydown",e=>{if(!lb.classList.contains("open"))return;if(e.key==="Escape")close();if(e.key==="ArrowLeft")show(cur+1);if(e.key==="ArrowRight")show(cur-1);});
let x0=null;lb.addEventListener("touchstart",e=>{x0=e.touches[0].clientX},{passive:true});
lb.addEventListener("touchend",e=>{if(x0===null)return;const dx=e.changedTouches[0].clientX-x0;x0=null;if(Math.abs(dx)>40)show(cur+(dx>0?1:-1));});
</script>
</body>
</html>
