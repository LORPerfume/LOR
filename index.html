<style>
:root{
  --gold:#d4af37;
  --gold-soft:rgba(212,175,55,.14);
  --gold-line:rgba(212,175,55,.28);
  --gold-grad:linear-gradient(90deg,#b8860b,#ffd700,#fff3b0,#d4af37,#b8860b);
  --bg:#000;
  --card:#0d0d0d;
  --card-2:#141414;
  --text:#fff;
  --muted:#b5b5b5;
  --radius:18px;
  --wrap:1100px;
  --header-h:64px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:calc(var(--header-h) + 12px)}
body{
  margin:0;
  font-family:"Tajawal",Arial,sans-serif;
  background:
    radial-gradient(circle at 15% 10%,rgba(212,175,55,.10),transparent 35%),
    radial-gradient(circle at 85% 60%,rgba(212,175,55,.07),transparent 40%),
    var(--bg);
  color:var(--text);
  line-height:1.7;
  overflow-x:hidden;
}
html[lang="en"] body{font-family:"Tajawal",Arial,sans-serif;letter-spacing:.2px}
img{max-width:100%;display:block}
a{color:inherit}
button{font-family:inherit}
.wrap{max-width:var(--wrap);margin:0 auto;padding:0 16px}
.latin{font-family:"Cinzel",serif}
.gold-text{
  background:var(--gold-grad);
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;
}
section{padding:56px 0}
.section-title{
  text-align:center;
  font-size:26px;
  font-weight:800;
  margin:0 0 6px;
  color:var(--gold);
}
.section-sub{text-align:center;color:var(--muted);margin:0 auto 28px;max-width:560px}

/* ===== HEADER ===== */
.header{
  position:fixed;inset:0 0 auto 0;height:var(--header-h);
  background:rgba(0,0,0,.72);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid var(--gold-line);
  z-index:100;
}
.header .wrap{height:100%;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.brand img{width:40px;height:40px;border-radius:10px;object-fit:cover}
.brand span{font-family:"Cinzel",serif;font-size:15px;letter-spacing:3px}
.nav{display:flex;align-items:center;gap:6px}
.nav a.link{
  text-decoration:none;font-size:14px;color:#ddd;padding:6px 10px;border-radius:8px;
}
.nav a.link:hover{color:var(--gold)}
.lang-btn{
  background:transparent;color:var(--gold);border:1px solid var(--gold-line);
  border-radius:8px;padding:6px 10px;font-size:13px;font-weight:700;cursor:pointer;
}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  background:var(--gold);color:#000;font-weight:800;text-decoration:none;
  border:none;border-radius:999px;padding:13px 28px;font-size:16px;cursor:pointer;
  transition:transform .2s, box-shadow .2s;
}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(212,175,55,.28)}
.btn.small{padding:8px 16px;font-size:14px}
.btn.ghost{background:transparent;color:var(--gold);border:1px solid var(--gold)}
@media (max-width:720px){
  .nav a.link{display:none}
  .brand span{font-size:13px;letter-spacing:2px}
}

/* ===== HERO ===== */
.hero h1{
  font-family:"Cinzel","Tajawal",serif;
  font-size:clamp(32px,7vw,58px);
  letter-spacing:4px;line-height:1.25;margin:0 0 10px;
}
html[lang="ar"] .hero h1{letter-spacing:0;font-family:"Tajawal",sans-serif;font-weight:800}
.hero p.lead{color:var(--muted);font-size:17px;max-width:560px;margin:0 auto 22px}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:20px}
.chip{
  background:rgba(255,255,255,.04);border:1px solid var(--gold-line);
  border-radius:999px;padding:6px 14px;font-size:14px;color:#eee;
}

/* ===== PRODUCTS ===== */
.products{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:760px){.products{grid-template-columns:1fr}}
.product{
  position:relative;background:linear-gradient(160deg,var(--card-2),var(--card));
  border:1px solid var(--gold-line);border-radius:22px;overflow:hidden;
  display:flex;flex-direction:column;
}
.product.featured{border-color:var(--gold);box-shadow:0 0 40px rgba(212,175,55,.14)}
.product .ribbon{
  position:absolute;top:14px;inset-inline-start:14px;z-index:2;
  background:var(--gold);color:#000;font-weight:800;font-size:13px;
  padding:5px 12px;border-radius:999px;
}
.product .media{background:#000;aspect-ratio:3/2;overflow:hidden}
.product .media img{width:100%;height:100%;object-fit:cover}
.product .media.contain img{object-fit:contain;padding:12px}
.product .body{padding:20px;display:flex;flex-direction:column;gap:10px;flex:1}
.product h3{margin:0;font-size:22px}
.product .price{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.product .price strong{font-size:34px;font-weight:800}
.product .price .ship{font-size:14px;color:var(--muted)}
.product .price .ship.free{color:#7ee2a8;font-weight:700}
.product ul{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.product li{display:flex;gap:8px;color:#ddd;font-size:15px}
.product li::before{content:"✦";color:var(--gold)}
.product .btn{margin-top:auto;width:100%}

/* ===== COMPARE ===== */
.compare{
  max-width:760px;margin:0 auto;border:1px solid var(--gold-line);border-radius:22px;overflow:hidden;
  background:linear-gradient(160deg,var(--card-2),var(--card));
}
.compare .row{display:grid;grid-template-columns:1fr 1.25fr 1.25fr;border-top:1px solid rgba(212,175,55,.15)}
.compare .row:first-child{border-top:none}
.compare .row > div{padding:14px 12px;font-size:15px;line-height:1.5}
.compare .head > div{font-weight:800;font-size:15px;padding:16px 12px}
.compare .head .lor{color:#000;background:var(--gold)}
.compare .head .other{color:var(--muted)}
.compare .label{color:var(--gold);font-weight:700}
.compare .lor{background:var(--gold-soft);color:#fff}
.compare .lor::before{content:"✓ ";color:var(--gold);font-weight:800}
.compare .head .lor::before{content:none}
.compare .other{color:var(--muted)}
.compare-note{text-align:center;color:#ddd;margin:18px auto 0;max-width:620px}
.compare-note strong{color:var(--gold)}
@media (max-width:480px){
  .compare .row > div{padding:12px 8px;font-size:13.5px}
  .compare .head > div{font-size:13.5px}
}

/* ===== NOTES ===== */
.notes{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:center}
@media (max-width:760px){.notes{grid-template-columns:1fr}}
.notes img{border-radius:var(--radius);border:1px solid var(--gold-line)}
.note-list{display:grid;gap:12px}
.note{
  background:rgba(255,255,255,.03);border:1px solid var(--gold-line);
  border-radius:14px;padding:14px 16px;
}
.note h4{margin:0 0 2px;color:var(--gold);font-size:16px}
.note p{margin:0;color:#ddd}

/* ===== STEPS / FEATURES ===== */
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media (max-width:760px){
  .grid-3{grid-template-columns:1fr}
  .grid-4{grid-template-columns:1fr 1fr}
}
.card{
  background:linear-gradient(160deg,var(--card-2),var(--card));
  border:1px solid var(--gold-line);border-radius:var(--radius);padding:16px;
}
.step img{border-radius:14px;width:100%;aspect-ratio:577/699;object-fit:cover;margin-bottom:12px}
.step h4,.feature h4{margin:0 0 4px;color:var(--gold);font-size:18px}
.step p,.feature p{margin:0;color:#ccc;font-size:15px}
.feature{text-align:center}
.feature .icon{font-size:28px;margin-bottom:6px}

/* ===== REVIEWS ===== */
.review .stars{color:var(--gold);letter-spacing:2px}
.review p{color:#ddd;margin:8px 0 12px}
.review .who{display:flex;align-items:center;gap:10px}
.review .who img{width:40px;height:40px;border-radius:50%;object-fit:cover;border:1px solid var(--gold-line)}
.review .who strong{display:block;font-size:15px}
.review .who span{font-size:13px;color:var(--muted)}
.center{text-align:center;margin-top:22px}

/* ===== STORY ===== */
.story{display:grid;grid-template-columns:1fr 1.2fr;gap:28px;align-items:center}
@media (max-width:760px){.story{grid-template-columns:1fr}}
.story img{border-radius:var(--radius);border:1px solid var(--gold-line)}
.story p{color:#ccc}

/* ===== FAQ ===== */
.faq{max-width:760px;margin:0 auto;display:grid;gap:10px}
.faq details{
  background:rgba(255,255,255,.03);border:1px solid var(--gold-line);
  border-radius:14px;padding:4px 16px;
}
.faq summary{
  cursor:pointer;list-style:none;padding:12px 0;font-weight:700;
  display:flex;justify-content:space-between;align-items:center;gap:10px;
}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";color:var(--gold);font-size:22px;line-height:1;transition:transform .2s}
.faq details[open] summary::after{transform:rotate(45deg)}
.faq details p{margin:0 0 14px;color:#ccc}

/* ===== ORDER ===== */
.order{
  max-width:640px;margin:0 auto;
  background:linear-gradient(160deg,#151515,#0a0a0a);
  border:1px solid var(--gold);border-radius:24px;padding:22px;
  box-shadow:0 0 50px rgba(212,175,55,.10);
}
.line-item{
  display:flex;align-items:center;gap:12px;
  padding:12px;border:1px solid var(--gold-line);border-radius:14px;margin-bottom:10px;
  background:rgba(255,255,255,.02);
}
.line-item img{width:58px;height:58px;border-radius:10px;object-fit:cover;background:#000}
.line-item .info{flex:1;min-width:0}
.line-item .info{line-height:1.4}
.line-item .info strong{display:block;font-size:15px}
.line-item .info span{font-size:13px;color:var(--muted)}
@media (max-width:420px){.stepper button{width:32px;height:32px}.line-item{gap:10px;padding:10px}.line-item img{width:50px;height:50px}}
.stepper{display:flex;align-items:center;border:1px solid var(--gold-line);border-radius:999px;overflow:hidden}
.stepper button{
  width:36px;height:36px;border:none;background:transparent;color:var(--gold);
  font-size:20px;cursor:pointer;
}
.stepper output{min-width:28px;text-align:center;font-weight:800}
.field{margin-top:12px}
.field label{display:block;font-size:14px;color:#ddd;margin-bottom:5px}
.field input,.field select,.field textarea{
  width:100%;padding:13px 14px;font-size:16px;font-family:inherit;
  background:#000;color:#fff;border:1px solid #2a2a2a;border-radius:12px;outline:none;
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--gold)}
.field textarea{min-height:84px;resize:vertical}
.field .err{color:#ff8a8a;font-size:13px;margin-top:4px;display:none}
.field.invalid input,.field.invalid select,.field.invalid textarea{border-color:#ff6b6b}
.field.invalid .err{display:block}
.summary{margin:18px 0 6px;border-top:1px dashed var(--gold-line);padding-top:12px}
.summary div{display:flex;justify-content:space-between;color:#ddd;padding:3px 0}
.summary .total{font-size:20px;font-weight:800;color:var(--gold)}
.summary .free{color:#7ee2a8;font-weight:700}
.upsell{
  margin-top:8px;font-size:14px;color:#ffd98a;background:var(--gold-soft);
  border-radius:10px;padding:8px 12px;display:none;
}
.order .btn{width:100%;margin-top:14px;font-size:17px}
.secure{text-align:center;color:var(--muted);font-size:13px;margin-top:10px}
.form-error{color:#ff8a8a;text-align:center;margin-top:10px;display:none}

/* ===== CONTACT / FOOTER ===== */
.contact-links{display:flex;justify-content:center;flex-wrap:wrap;gap:10px}
.contact-links a{
  text-decoration:none;border:1px solid var(--gold-line);border-radius:12px;
  padding:10px 18px;color:var(--gold);font-weight:700;background:rgba(255,255,255,.03);
}
.contact-links a:hover{border-color:var(--gold)}
footer{border-top:1px solid var(--gold-line);padding:28px 0;text-align:center;color:var(--muted);font-size:14px}
footer nav{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 16px;margin-bottom:10px}
footer nav a{text-decoration:none;color:#ccc}
footer nav a:hover{color:var(--gold)}

/* ===== FLOATING / STICKY ===== */
.wa-float{
  position:fixed;bottom:24px;inset-inline-end:16px;z-index:90;
  width:54px;height:54px;border-radius:50%;background:#25D366;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 8px 22px rgba(0,0,0,.45);
}
.wa-float svg{width:30px;height:30px;fill:#fff}

/* reveal on scroll */
.reveal{opacity:0;transform:translateY(18px);transition:opacity .6s, transform .6s}
.reveal.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .reveal{opacity:1;transform:none;transition:none}
}

/* ===== VISUAL v2 ===== */
/* luxury Arabic display font */
html[lang="ar"] .section-title,
html[lang="ar"] .hero h1,
html[lang="ar"] .product h3,
html[lang="ar"] .step h4,
html[lang="ar"] .feature h4,
html[lang="ar"] .pyramid h4{font-family:"El Messiri","Tajawal",serif}
html[lang="ar"] .section-title{font-weight:700;font-size:30px}

/* icons */
.ic{width:1.15em;height:1.15em;flex:none;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em}
.chip{display:inline-flex;align-items:center;gap:7px}
.chip .ic{color:var(--gold)}
.feature .icon{
  width:58px;height:58px;margin:0 auto 10px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  border:1px solid var(--gold-line);
  background:radial-gradient(circle at 30% 30%,rgba(212,175,55,.22),rgba(212,175,55,.04));
  color:var(--gold);
}
.feature .icon .ic{width:28px;height:28px;stroke-width:1.3}
.contact-links a{display:inline-flex;align-items:center;gap:8px}
.secure,.upsell{gap:6px}
.secure .ic,.upsell .ic{color:var(--gold)}
.btn .ic{width:1.1em;height:1.1em}

/* 3. shimmer */
.gold-text{background-size:200% auto;animation:goldShine 7s linear infinite}
@keyframes goldShine{to{background-position:200% center}}
.btn{position:relative;overflow:hidden;isolation:isolate}
.btn:not(.ghost)::after{
  content:"";position:absolute;top:0;bottom:0;left:-70%;width:45%;z-index:-1;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.65),transparent);
  transform:skewX(-20deg);animation:btnSweep 4.8s ease-in-out infinite;
}
@keyframes btnSweep{0%,72%{left:-70%}100%{left:135%}}

/* 7. ornaments */
.ornament{display:flex;align-items:center;justify-content:center;gap:12px;margin:0 auto 14px;max-width:260px;color:var(--gold)}
.ornament.start{justify-content:flex-start;margin-inline:0}
.ornament i{flex:1;height:1px;max-width:90px;background:linear-gradient(90deg,transparent,var(--gold))}
.ornament i:last-child{background:linear-gradient(90deg,var(--gold),transparent)}
.ornament.start i:first-child{display:none}
.ornament svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.2}

/* 2. cinematic hero */
.hero{
  position:relative;min-height:100vh;min-height:100svh;
  display:flex;align-items:flex-end;
  padding:calc(var(--header-h) + 20px) 0 64px;
  overflow:hidden;text-align:center;
}
.hero-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 22%;
  animation:kenBurns 22s ease-out both}
@keyframes kenBurns{from{transform:scale(1.12)}to{transform:scale(1)}}
.hero-shade{position:absolute;inset:0;
  background:
    linear-gradient(to top,#000 6%,rgba(0,0,0,.72) 34%,rgba(0,0,0,.18) 64%,rgba(0,0,0,.5) 100%),
    radial-gradient(ellipse at 50% 100%,rgba(212,175,55,.18),transparent 60%);}
.dust{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
.hero-content{position:relative;z-index:2;width:100%}
.hero-content > *{opacity:0;animation:rise .9s cubic-bezier(.2,.7,.2,1) forwards}
.hero-content > :nth-child(1){animation-delay:.15s}
.hero-content > :nth-child(2){animation-delay:.35s}
.hero-content > :nth-child(3){animation-delay:.55s}
.hero-content > :nth-child(4){animation-delay:.75s}
.hero-content > :nth-child(5){animation-delay:.9s}
@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.hero p.lead{color:#e6e6e6;text-shadow:0 2px 12px rgba(0,0,0,.6)}
.hero h1{filter:drop-shadow(0 4px 18px rgba(0,0,0,.55))}
.hero .chip{background:rgba(0,0,0,.45);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.scroll-cue{display:block;width:26px;height:40px;margin:26px auto 0;border:1.5px solid var(--gold-line);border-radius:14px;position:relative}
.scroll-cue::after{content:"";position:absolute;left:50%;top:8px;width:4px;height:8px;margin-left:-2px;border-radius:2px;background:var(--gold);animation:cue 1.8s ease-in-out infinite}
@keyframes cue{0%{opacity:0;transform:translateY(0)}40%{opacity:1}100%{opacity:0;transform:translateY(14px)}}

/* 6. fragrance pyramid */
.notes-wrap{display:grid;grid-template-columns:1fr 1.1fr;gap:28px;align-items:center}
@media (max-width:760px){.notes-wrap{grid-template-columns:1fr}}
.notes-wrap > img{border-radius:var(--radius);border:1px solid var(--gold-line)}
.family{
  display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;
  margin:0 auto 18px;padding:8px 16px;width:max-content;max-width:100%;
  border:1px solid var(--gold-line);border-radius:999px;color:#eee;background:rgba(255,255,255,.03);
}
.family .ic{color:var(--gold)}
.family strong{color:var(--gold);font-weight:700}
.pyramid{display:flex;flex-direction:column;align-items:center;gap:6px;filter:drop-shadow(0 12px 30px rgba(212,175,55,.12))}
.tier{
  text-align:center;padding:18px 14% 14px;
  clip-path:polygon(12% 0,88% 0,100% 100%,0 100%);
}
.tier h4{margin:0;font-size:16px;letter-spacing:.5px}
.tier p{margin:2px 0 0;font-size:14px;line-height:1.5}
.pyramid .apex{width:0;height:0;border-inline:22px solid transparent;border-bottom:26px solid #fff3b0;margin-bottom:-6px}
.tier.t1{width:60%;padding:16px 13% 14px;clip-path:polygon(16% 0,84% 0,100% 100%,0 100%);
  background:linear-gradient(180deg,#fff3b0,#e5c35a);color:#1a1300}
.tier.t2{width:79%;background:linear-gradient(180deg,#d9b44a,#b8902c);color:#140f00}
.tier.t3{width:100%;background:linear-gradient(180deg,#8a6a1c,#4a3810);color:#fff3d0}
.tier.t3 h4{color:#ffe08a}
@media (max-width:420px){
  .tier{padding-inline:11%}
  .tier.t1{width:66%}
  .tier.t2{width:84%}
  .tier p{font-size:13px}
}

@media (prefers-reduced-motion:reduce){
  .gold-text,.btn::after,.hero-bg,.scroll-cue::after{animation:none!important}

}

/* ===== الحسابات ===== */
function totals(){
  const p = CONFIG.products;
  const subtotal = cart.package * p.package.price + cart.solid * p.solid.price;
  const items = cart.package + cart.solid;
  const delivery = items === 0 || cart.package > 0 ? 0 : CONFIG.deliveryFee;
  return { subtotal, delivery, total: subtotal + delivery, items };
}
const money = n => `${n} ${t("jd")}`;

function render(){
  document.querySelectorAll(".stepper").forEach(s => {
    s.querySelector("output").textContent = cart[s.dataset.item];
  });
  const { subtotal, delivery, total, items } = totals();
  document.getElementById("sSubtotal").textContent = money(subtotal);
  const d = document.getElementById("sDelivery");
  d.textContent = items && delivery === 0 ? t("s.free") : money(delivery);
  d.className = items && delivery === 0 ? "free" : "";
  document.getElementById("sTotal").textContent = money(total);
  document.getElementById("upsell").style.display = cart.solid > 0 && cart.package === 0 ? "block" : "none";
  if (items) document.getElementById("formError").style.display = "none";
}

function setQty(item, qty){
  const before = cart[item];
  cart[item] = Math.max(0, Math.min(CONFIG.maxQty, qty));
  if (cart[item] > before) {
    track("AddToCart", { content_ids:[item], content_type:"product",
      value: CONFIG.products[item].price, currency:"JOD" });
  }
  render();
}

document.querySelectorAll(".stepper button").forEach(b => {
  b.addEventListener("click", () => {
    const item = b.closest(".stepper").dataset.item;
    setQty(item, cart[item] + Number(b.dataset.step));
  });
});
document.querySelectorAll("[data-add]").forEach(b => {
  b.addEventListener("click", () => {
    const item = b.dataset.add;
    if (cart[item] === 0) setQty(item, 1);
    document.getElementById("order").scrollIntoView({ behavior:"smooth" });
  });
});

function toEnglishDigits(str){
  return str.replace(/[٠-٩]/g, d => d.charCodeAt(0) - 1632)
            .replace(/[۰-۹]/g, d => d.charCodeAt(0) - 1776);
}
function normalizeJordanPhone(raw){
  let p = toEnglishDigits(raw).replace(/[\s\-()]/g, "");
  if (p.startsWith("+962")) p = "0" + p.slice(4);
  else if (p.startsWith("00962")) p = "0" + p.slice(5);
  else if (p.startsWith("962")) p = "0" + p.slice(3);
  else if (/^7[789]\d{7}$/.test(p)) p = "0" + p;
  return /^07[789]\d{7}$/.test(p) ? p : null;
}
function makeOrderID(){
  const d = new Date(), pad = n => String(n).padStart(2, "0");
  return pad(d.getMonth()+1) + pad(d.getDate()) + "-" + pad(d.getHours()) + pad(d.getMinutes()) +
         pad(Math.floor(Math.random()*100));
}

let checkoutTracked = false;
document.getElementById("orderForm").addEventListener("focusin", () => {
  if (checkoutTracked) return;
  checkoutTracked = true;
  const { total, items } = totals();
  track("InitiateCheckout", { value: total, currency:"JOD", num_items: items });
});

document.getElementById("orderForm").addEventListener("submit", e => {
  e.preventDefault();
  const v = id => document.getElementById(id).value.trim();
  const name = v("name"), phone = normalizeJordanPhone(v("phone")),
        cityKey = v("city"), address = v("address");
  const checks = [["f-name", !!name], ["f-phone", !!phone], ["f-city", !!cityKey], ["f-address", !!address]];
  let firstBad = null;
  checks.forEach(([id, ok]) => {
    document.getElementById(id).classList.toggle("invalid", !ok);
    if (!ok && !firstBad) firstBad = id;
  });
  const { subtotal, delivery, total, items } = totals();
  document.getElementById("formError").style.display = items ? "none" : "block";
  if (!items) { document.querySelector(".line-item").scrollIntoView({behavior:"smooth", block:"center"}); return; }
  if (firstBad) { document.querySelector(`#${firstBad} input, #${firstBad} select, #${firstBad} textarea`).focus(); return; }

  const city = CITIES.find(c => c[0] === cityKey);
  const cityName = lang === "ar" ? city[1] : city[2];
  const orderID = makeOrderID();
  const lines = [];
  if (cart.package) lines.push(`• ${t("pkg.name")} × ${cart.package} = ${money(cart.package * CONFIG.products.package.price)}`);
  if (cart.solid)   lines.push(`• ${t("solid.name")} × ${cart.solid} = ${money(cart.solid * CONFIG.products.solid.price)}`);

  const message =
`${t("msg.title")} #${orderID}

${t("msg.name")}: ${name}
${t("msg.phone")}: ${phone}
${t("msg.city")}: ${cityName}
${t("msg.address")}: ${address}

${t("msg.items")}:
${lines.join("\n")}

${t("msg.delivery")}: ${delivery ? money(delivery) : t("s.free")}
${t("msg.total")}: ${money(total)}
${t("msg.cod")}`;

  track("Purchase", { value: total, currency:"JOD", num_items: items,
    content_ids: Object.keys(cart).filter(k => cart[k]), content_type:"product" });

  if (CONFIG.sheetsUrl) {
    try {
      fetch(CONFIG.sheetsUrl, { method:"POST", mode:"no-cors",
        body: JSON.stringify({ orderID, name, phone, city: city[2], address,
          package: cart.package, solid: cart.solid, subtotal, delivery, total, lang }) });
    } catch(err) {}
  }

  window.open(`https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent(message)}`, "_blank");
});

["name","phone","city","address"].forEach(id => {
  document.getElementById(id).addEventListener("input", () =>
    document.getElementById("f-" + id).classList.remove("invalid"));
});

/* ===== ظهور تدريجي ===== */
const io = new IntersectionObserver(entries => entries.forEach(en => {
  if (en.isIntersecting) { en.target.classList.add("in"); io.unobserve(en.target); }
}), { threshold: 0.12 });
document.querySelectorAll(".reveal").forEach(el => io.observe(el));

/* ===== ViewContent ===== */
new IntersectionObserver(([en], obs) => {
  if (en.isIntersecting) { track("ViewContent", { content_ids:["package","solid"], content_type:"product" }); obs.disconnect(); }
}, { threshold: 0.3 }).observe(document.getElementById("products"));

/* ===== ذرات ذهبية بالواجهة ===== */
(function(){
  const c = document.getElementById("dust");
  if (!c || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const ctx = c.getContext("2d");
  let w, h, dpr, parts = [], running = false, raf;
  function size(){
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = c.clientWidth; h = c.clientHeight;
    c.width = w * dpr; c.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function make(randomY){
    return { x: Math.random() * w, y: randomY ? Math.random() * h : h + 10,
      r: .6 + Math.random() * 1.8, vy: .15 + Math.random() * .45,
      sway: Math.random() * 6.28, sp: .004 + Math.random() * .01, a: .25 + Math.random() * .6 };
  }
  function init(){
    size();
    const n = w < 600 ? 28 : 50;
    parts = Array.from({ length: n }, () => make(true));
  }
  function frame(){
    ctx.clearRect(0, 0, w, h);
    for (const p of parts) {
      p.y -= p.vy; p.sway += p.sp;
      const x = p.x + Math.sin(p.sway) * 14;
      if (p.y < -10) Object.assign(p, make(false));
      const tw = p.a * (.6 + .4 * Math.sin(p.sway * 3));
      const g = ctx.createRadialGradient(x, p.y, 0, x, p.y, p.r * 3);
      g.addColorStop(0, `rgba(255,226,140,${tw})`);
      g.addColorStop(1, "rgba(212,175,55,0)");
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(x, p.y, p.r * 3, 0, 6.283); ctx.fill();
    }
    raf = requestAnimationFrame(frame);
  }
  function start(){ if (!running) { running = true; frame(); } }
  function stop(){ running = false; cancelAnimationFrame(raf); }
  init();
  addEventListener("resize", init);
  new IntersectionObserver(([e]) => e.isIntersecting ? start() : stop()).observe(c);
  document.addEventListener("visibilitychange", () => document.hidden ? stop() : start());
})();

document.getElementById("year").textContent = new Date().getFullYear();
applyLang(store("lang") || "ar");
